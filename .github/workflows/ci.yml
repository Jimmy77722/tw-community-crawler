name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: 裝 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安裝（含 dev 依賴；不含 browser extras）
        run: python -m pip install -e ".[dev]"
      - name: 離線測試（fixtures，不打任何真實站點）
        run: python -m pytest -q
