# PTT：免登入。pttweb.cc 現為 Google CSE 渲染（純 HTML 無文章連結，2026-10-25 實測），
# 故用 browser 渲染後吃連結規則；連結是 ptt.cc 文章頁，不用登入。
site: ptt
method: browser
search_url: "https://pttweb.cc/search?q={kw}"
wait_selector: "a[href*='.html']"
settle_ms: 3000   # Google CSE 結果延遲渲染
max_items: 20
extract:
  rule: link
  container: "a"
  link_filter: "/bbs/"            # href 需含此字串
  id_regex: "/bbs/\\w+/(M\\.\\d+)"     # PTT 文章 ID
  title_from: text
  board_regex: "/bbs/(\\w+)/"
