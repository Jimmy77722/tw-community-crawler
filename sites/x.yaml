# X（Twitter）：需登入、預設關閉、風險自負。走使用者自己已登入的 Chrome（--cdp）。
# 只用公開搜尋頁結構，實測易受 A/B 測試影響；EMPTY 時照 probe 重探、只改這支 yaml。
# 作者輸出一律雜湊成 user_<hash8>（--keep-author 才保留原樣）。
site: x
method: browser
login_required: true
search_url: "https://x.com/search?q={kw}&f=live"
wait_selector: "article"
rate_limit: [10, 20]   # 登入站從嚴：至少 10 秒一次
max_items: 50
extract:
  rule: text-rule      # 推文卡片 innerText：[@帳號, 顯示名, 時間, 內文…]
  container: "article"
  row_pattern: "^(.+?)\n(.+?)\n(.+?)\n(.*)$"
  base_url: "https://x.com"
  fields:
    board: 1           # @帳號（顯示用；輸出時已被雜湊遮罩）
    author: 2
    title: "$rest-first"
